<div class="container mt-5">

  <button class="btn btn-secondary mb-4" (click)="goBack()">
    ← Back
  </button>

  <h2 class="mb-4">Campaign Participants</h2>

  @if (loading) {
    <div class="text-center">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  }

  @if (!loading && participants.length === 0) {
    <div class="alert alert-info">
      No participants yet.
    </div>
  }

  @for (participant of participants; track participant.participantId) {
    <div class="participant-card">
      <div class="card-body">
        <h5 class="card-title">{{ participant.influencerUsername }}</h5>
        <p class="card-text mb-0">
          <strong>Joined:</strong> {{ participant.joinedAt }}
        </p>
      </div>
    </div>
  }

</div>
