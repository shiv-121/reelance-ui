<nav class="navbar">

  <div
    class="logo"
    [routerLink]="dashboardRoute">

    Reelance

  </div>

  <div class="nav-links">

    @if (role === 'BRAND') {

      <a routerLink="/brand">
        Dashboard
      </a>

      <a routerLink="/brand/campaigns">
        Campaigns
      </a>

      <a routerLink="/brand/influencers">
        Influencers
      </a>

    }

    @if (role === 'INFLUENCER') {

      <a routerLink="/influencer">
        Dashboard
      </a>

      <a routerLink="/influencer/campaigns">
        Browse Campaigns
      </a>

      <a routerLink="/influencer/applications">
        My Applications
      </a>

    }

  </div>

  <div class="actions">

    <button
      class="profile-btn"
      [routerLink]="isBrand ? '/brand/profile' : '/profile'">

      {{ isBrand ? 'Company' : 'Profile' }}

    </button>

    <button
      class="logout-btn"
      (click)="logout()">

      Logout

    </button>

  </div>

</nav>
