<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-4">

      <h2 class="mb-4">
        Reelance Login
      </h2>

      <form (ngSubmit)="login()">

        <div class="mb-3">

          <label>Email</label>

          <input
            type="email"
            class="form-control"
            [(ngModel)]="email"
            name="email">
        </div>

        <div class="mb-3">

          <label>Password</label>

          <input
            type="password"
            class="form-control"
            [(ngModel)]="password"
            name="password">
        </div>

        <button
          class="btn btn-primary w-100"
          type="submit">

          Login

        </button>

      </form>

    </div>

  </div>

</div>
