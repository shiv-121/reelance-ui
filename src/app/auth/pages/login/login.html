<div class="container">
  <div class="row vh-100 align-items-center justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h2 class="text-center mb-4">Reelance</h2>
          <p class="text-center text-muted mb-4">Connect Brands & Influencers</p>
          <form (ngSubmit)="login()">
            <div class="mb-3">
              <input type="email" class="form-control" placeholder="Email" [(ngModel)]="email" name="email" required>
            </div>
            <div class="mb-3">
              <input type="password" class="form-control" placeholder="Password" [(ngModel)]="password" name="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
          </form>
          <div class="text-center mt-3">
            <small class="text-muted">Don't have an account? <a routerLink="/register" class="text-primary">Create Account</a></small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
