<div class="profile-page">
  <h1>My Profile</h1>

  @if (loading) {
    <p>Loading...</p>
  } @else {
    @if (successMessage) {
      <div class="success-box">
        {{ successMessage }}
      </div>
    }

    @if (errorMessage) {
      <div class="error-box">
        {{ errorMessage }}
      </div>
    }

    <div class="form-card">
      <label>Instagram Handle</label>
      <input
        [(ngModel)]="profile.instagramHandle">

      <label>Followers</label>
      <input
        type="number"
        [(ngModel)]="profile.followers">

      <label>Niche</label>
      <input
        [(ngModel)]="profile.niche">

      <label>Price Per Post</label>
      <input
        type="number"
        [(ngModel)]="profile.pricePerPost">

      <button (click)="saveProfile()">
        Save Changes
      </button>
    </div>
  }
</div>
